<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno TRF3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: uma coluna estreita como folha de prova, abas no topo, cartão-resposta com bolhas A a E */
:root {
  --paper: #F5F7FB;
  --sheet: #FFFFFF;
  --ink: #15203A;
  --muted: #5A6480;
  --line: #D8DEEA;
  --pen: #1D4ED8;
  --pen-soft: #E3EAFD;
  --mark: #FFE45E;
  --mark-ink: #3B3200;
  --ok: #17784A;
  --ok-soft: #DDF3E7;
  --err: #B42318;
  --err-soft: #FBE3E0;
  --f-text: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1320; --sheet: #161D2E; --ink: #E5EAF4; --muted: #9AA5BE; --line: #2A3450;
    --pen: #8AA8FF; --pen-soft: #1F2C52; --mark: #8C7A12; --mark-ink: #FFF6C2;
    --ok: #5CCB8F; --ok-soft: #133A27; --err: #FF8B7E; --err-soft: #46201C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1320; --sheet: #161D2E; --ink: #E5EAF4; --muted: #9AA5BE; --line: #2A3450;
  --pen: #8AA8FF; --pen-soft: #1F2C52; --mark: #8C7A12; --mark-ink: #FFF6C2;
  --ok: #5CCB8F; --ok-soft: #133A27; --err: #FF8B7E; --err-soft: #46201C;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--f-ui);
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--sheet);
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--sheet); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 12px 4px; }
.brand h1 { margin: 0; font: 700 18px/1.2 var(--f-ui); letter-spacing: -0.01em; }
.brand h1 span { color: var(--pen); }
.brand small { color: var(--muted); font: 500 12px var(--f-num); }
.who { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.trocar { padding: 2px 8px; font-size: 12px; border-radius: 999px; }
body.sem-perfil nav.tabs { display: none; }
.perfis { display: grid; gap: 10px; }
.perfil { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px; border-radius: 12px; }
.perfil:hover { border-color: var(--pen); }
.perfil b { display: block; font-size: 17px; }
.perfil .note { font-weight: 400; }
.perfil .ini { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--pen-soft); color: var(--pen); font: 600 18px var(--f-num); }
nav.tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs a {
  flex: 1 0 auto; text-align: center; padding: 10px 6px; color: var(--muted); white-space: nowrap;
  text-decoration: none; font-weight: 600; font-size: 13px; border-bottom: 3px solid transparent;
}
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--pen); }
main { padding-block: 16px 48px; display: grid; gap: 16px; }

.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.f { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
select, textarea, input[type="number"] {
  font: 15px var(--f-ui); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 120px; font: 13px/1.4 var(--f-num); resize: vertical; }
button {
  font: 600 14px var(--f-ui); cursor: pointer; border-radius: 8px; padding: 10px 14px;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink);
}
button.primary { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
button.ghost { background: transparent; }
button.danger { color: var(--err); border-color: var(--err); background: transparent; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button:focus-visible, a:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }

/* Questão */
.qmeta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.qmeta .num { font: 600 13px var(--f-num); color: var(--ink); }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--pen-soft); color: var(--pen); font-weight: 600; font-size: 12px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.err { background: var(--err-soft); color: var(--err); }
.enun { font: 17px/1.6 var(--f-text); margin: 0; text-wrap: pretty; }
.alts { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.alt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--sheet); }
.alt .pick { all: unset; display: flex; gap: 12px; align-items: flex-start; flex: 1; min-width: 0; cursor: pointer; }
.alt .pick:focus-visible { outline: 2px solid var(--pen); outline-offset: 4px; border-radius: 6px; }
.bubble {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font: 600 13px var(--f-num); color: var(--muted);
}
.alt .txt { font: 16px/1.5 var(--f-text); padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
.alt.sel { border-color: var(--pen); background: var(--pen-soft); }
.alt.sel .bubble { background: var(--pen); border-color: var(--pen); color: var(--sheet); }
.alt.cut .txt { text-decoration: line-through; color: var(--muted); }
.alt.cut .bubble { opacity: 0.4; }
.alt.right { border-color: var(--ok); background: var(--ok-soft); }
.alt.right .bubble { background: var(--ok); border-color: var(--ok); color: var(--sheet); }
.alt.wrong { border-color: var(--err); background: var(--err-soft); }
.alt.wrong .bubble { background: var(--err); border-color: var(--err); color: var(--sheet); }
.cutbtn { flex: none; padding: 4px 8px; font-size: 12px; color: var(--muted); background: transparent; border: none; text-decoration: underline; }
.result { border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.result.ok { background: var(--ok-soft); }
.result.err { background: var(--err-soft); }
.result strong { font-size: 15px; }
.result.ok strong { color: var(--ok); }
.result.err strong { color: var(--err); }
.coment { font: 15px/1.6 var(--f-text); margin: 0; }
.coment mark, .hl { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px; }
.navq { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.navq .grow { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }

/* Cartão-resposta do simulado */
.sheetgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.sheetgrid button { padding: 6px 0; font: 600 12px var(--f-num); display: grid; gap: 2px; }
.sheetgrid button.done { background: var(--pen-soft); border-color: var(--pen); color: var(--pen); }
.sheetgrid button.here { outline: 2px solid var(--ink); }
.sheetgrid button.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.sheetgrid button.err { background: var(--err-soft); border-color: var(--err); color: var(--err); }
.timer { font: 600 20px var(--f-num); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--err); }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 6px 0; }
.revitem { display: flex; gap: 12px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.revitem > div { min-width: 0; }
.agenda { margin: 6px 0 0; padding-left: 20px; font-family: var(--f-num); font-size: 14px; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--err); color: var(--sheet); font: 600 11px var(--f-num); vertical-align: 1px; }
span.f { display: block; margin-bottom: 2px; }
.checks input { width: 18px; height: 18px; accent-color: var(--pen); }

/* Desempenho */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--sheet); }
.kpi b { display: block; font: 600 26px/1.1 var(--f-num); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.bars { display: grid; gap: 12px; }
.bar { display: grid; gap: 4px; }
.bar .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar .lbl span:last-child { font: 500 13px var(--f-num); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { height: 10px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--pen); }
.fill.good { background: var(--ok); }
.fill.bad { background: var(--err); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
td.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.scroll { overflow-x: auto; }
h2 { margin: 0; font: 700 16px/1.3 var(--f-ui); text-wrap: balance; }
p.hint { margin: 0; color: var(--muted); font-size: 14px; }
details summary { cursor: pointer; font-weight: 600; }
#filtros summary { color: var(--muted); font-size: 14px; }
#filtros[open] summary { margin-bottom: 4px; }
.note { font-size: 13px; color: var(--muted); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px;
  max-width: calc(100% - 32px);
}
@media (prefers-reduced-motion: no-preference) {
  .alt { transition: background-color .15s, border-color .15s; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Caderno <span>TRF3</span></h1>
      <div class="who"><small id="brandCount"></small><button id="bTrocar" class="trocar" hidden>Trocar</button></div>
    </div>
    <nav class="tabs" aria-label="Seções">
      <a href="#questoes" data-tab="questoes">Questões</a>
      <a href="#posaula" data-tab="posaula">Pós-aula</a>
      <a href="#simulado" data-tab="simulado">Simulado</a>
      <a href="#desempenho" data-tab="desempenho">Evolução</a>
      <a href="#ajustes" data-tab="ajustes">Ajustes</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="questoes.js"></script>
<script>
(function () {
  "use strict";
  var LETRAS = ["A", "B", "C", "D", "E"];
  var KEY = "caderno-trf3:v1";

  // ---------- armazenamento (um registro por pessoa) ----------
  var PERFIS = ["Giovanna", "Bruno"];
  var EDITAL = window.EDITAL || { cargo: "", blocos: [] };
  var perfil = null;
  function lerJSON(k) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function chavePerfil(n) { return KEY + ":perfil:" + n; }
  function load(nome) {
    var s = lerJSON(chavePerfil(nome)) || {};
    return { resp: s.resp || {}, sims: s.sims || [], revs: s.revs || [] };
  }
  // dados da versão sem perfis passam a ser do Bruno
  (function migrar() {
    var velho = lerJSON(KEY);
    if (!velho || velho.migrado) return;
    if (!lerJSON(chavePerfil("Bruno"))) gravar(chavePerfil("Bruno"), { resp: velho.resp || {}, sims: velho.sims || [], revs: velho.revs || [] });
    if (velho.extra && velho.extra.length && !lerJSON(KEY + ":extra")) gravar(KEY + ":extra", velho.extra);
    gravar(KEY, { migrado: true });
  })();
  var extras = lerJSON(KEY + ":extra") || [];
  var store = { resp: {}, sims: [], revs: [] };
  function save() { if (perfil) gravar(chavePerfil(perfil), store); }
  function saveExtras() { gravar(KEY + ":extra", extras); }

  // disciplinas na ordem do edital
  var ORDEM = EDITAL.blocos.reduce(function (a, b) { return a.concat(b.disciplinas); }, []);
  function blocoDe(d) { return EDITAL.blocos.find(function (b) { return b.disciplinas.indexOf(d) >= 0; }) || null; }
  function pesoDe(d) { var b = blocoDe(d); return b ? b.peso : 1; }
  function ordenar(lista) {
    return lista.slice().sort(function (a, b) {
      var ia = ORDEM.indexOf(a), ib = ORDEM.indexOf(b);
      if (ia < 0) ia = 999; if (ib < 0) ib = 999;
      return ia - ib || a.localeCompare(b);
    });
  }

  function todas() { return (window.QUESTOES || []).concat(extras); }
  function porId(id) { return todas().find(function (q) { return q.id === id; }); }
  function registrar(q, alt) {
    var certo = alt === q.correta;
    (store.resp[q.id] = store.resp[q.id] || []).push({ a: alt, c: certo, t: Date.now() });
    save();
    return certo;
  }
  function ultima(id) { var r = store.resp[id]; return r && r.length ? r[r.length - 1] : null; }

  // ---------- utilidades ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uniq(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function mmss(s) { s = Math.max(0, Math.round(s)); var m = Math.floor(s / 60); return (m < 10 ? "0" : "") + m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60); }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }
  var app = document.getElementById("app");

  // ---------- ABA QUESTÕES ----------
  var filtrosAbertos = false;
  var qs = { disc: "", ass: "", status: "todas", lista: [], i: 0, sel: null, respondida: false, cortes: {} };

  function filtrar() {
    return todas().filter(function (q) {
      if (qs.disc && q.disciplina !== qs.disc) return false;
      if (qs.ass && q.assunto !== qs.ass) return false;
      var u = ultima(q.id);
      if (qs.status === "nao" && u) return false;
      if (qs.status === "erradas" && !(u && !u.c)) return false;
      if (qs.status === "certas" && !(u && u.c)) return false;
      return true;
    }).map(function (q) { return q.id; });
  }
  function novaLista(embaralhar) {
    var l = filtrar();
    qs.lista = embaralhar ? shuffle(l) : l;
    qs.i = 0; resetQ();
  }
  function resetQ() { qs.sel = null; qs.respondida = false; qs.cortes = {}; }

  function altsHTML(q, sel, cortes, gabarito, permitirCorte) {
    return '<ol class="alts">' + q.alternativas.map(function (txt, k) {
      var cls = "alt";
      if (gabarito) {
        if (k === q.correta) cls += " right";
        else if (k === sel) cls += " wrong";
      } else if (k === sel) cls += " sel";
      if (cortes[k] && !gabarito) cls += " cut";
      return '<li class="' + cls + '">' +
        '<button class="pick" data-alt="' + k + '"' + (gabarito ? " disabled" : "") + ' aria-label="Alternativa ' + LETRAS[k] + '">' +
        '<span class="bubble">' + LETRAS[k] + '</span><span class="txt">' + esc(txt) + '</span></button>' +
        (permitirCorte && !gabarito ? '<button class="cutbtn" data-cut="' + k + '">' + (cortes[k] ? "desfazer" : "riscar") + '</button>' : "") +
        '</li>';
    }).join("") + "</ol>";
  }

  function historicoTxt(id) {
    var r = store.resp[id] || [];
    if (!r.length) return "";
    var ac = r.filter(function (x) { return x.c; }).length;
    return "Você já respondeu " + r.length + (r.length === 1 ? " vez" : " vezes") + " e acertou " + ac + ".";
  }

  function viewQuestoes() {
    var all = todas();
    var discs = ordenar(uniq(all.map(function (q) { return q.disciplina; })));
    var asss = uniq(all.filter(function (q) { return !qs.disc || q.disciplina === qs.disc; }).map(function (q) { return q.assunto; })).sort();
    var resumo = [qs.disc || "Todas as disciplinas", qs.ass, { nao: "não resolvidas", erradas: "erradas", certas: "acertadas" }[qs.status]].filter(Boolean).join(" · ");
    var html = '<details class="panel" id="filtros"' + (filtrosAbertos ? " open" : "") + '><summary>Filtros: ' + esc(resumo) + '</summary><div class="grid-filters">' +
      '<label class="f">Disciplina<select id="fDisc"><option value="">Todas</option>' +
      discs.map(function (d) { return '<option' + (d === qs.disc ? " selected" : "") + ">" + esc(d) + "</option>"; }).join("") + "</select></label>" +
      '<label class="f">Assunto<select id="fAss"><option value="">Todos</option>' +
      asss.map(function (a) { return '<option' + (a === qs.ass ? " selected" : "") + ">" + esc(a) + "</option>"; }).join("") + "</select></label>" +
      '<label class="f">Situação<select id="fStatus">' +
      [["todas", "Todas"], ["nao", "Não resolvidas"], ["erradas", "Errei da última vez"], ["certas", "Acertei da última vez"]].map(function (o) {
        return '<option value="' + o[0] + '"' + (o[0] === qs.status ? " selected" : "") + ">" + o[1] + "</option>";
      }).join("") + "</select></label></div>" +
      '<div class="row"><button id="bShuffle" class="ghost">Embaralhar</button><span class="note">' + qs.lista.length + " questões neste filtro</span></div></details>";

    if (!qs.lista.length) {
      html += '<section class="panel empty">Nenhuma questão com esses filtros.<br>Troque a situação para "Todas".</section>';
      app.innerHTML = html; bindFiltros(); return;
    }
    var q = porId(qs.lista[qs.i]);
    var u = ultima(q.id);
    html += '<article class="panel" aria-live="polite">' +
      '<div class="qmeta"><span class="num">' + (qs.i + 1) + "/" + qs.lista.length + "</span>" +
      '<span class="chip">' + esc(q.disciplina) + "</span><span>" + esc(q.assunto) + "</span>" +
      (u && !qs.respondida ? '<span class="chip ' + (u.c ? "ok" : "err") + '">' + (u.c ? "acertou antes" : "errou antes") + "</span>" : "") +
      "</div>" +
      '<p class="enun">' + esc(q.enunciado) + "</p>" +
      altsHTML(q, qs.sel, qs.cortes, qs.respondida, true);
    if (qs.respondida) {
      var ok = qs.sel === q.correta;
      html += '<div class="result ' + (ok ? "ok" : "err") + '"><strong>' +
        (ok ? "Você acertou." : "Você errou. Gabarito: " + LETRAS[q.correta] + ".") + "</strong>" +
        '<p class="coment">' + esc(q.comentario || "Sem comentário.") + "</p>" +
        '<span class="note">' + historicoTxt(q.id) + "</span></div>";
    }
    html += '<div class="navq">' +
      '<button id="bPrev" class="ghost"' + (qs.i === 0 ? " disabled" : "") + ">Anterior</button>" +
      (qs.respondida
        ? '<button id="bNext" class="primary grow"' + (qs.i >= qs.lista.length - 1 ? " disabled" : "") + ">Próxima questão</button>"
        : '<button id="bAnswer" class="primary grow"' + (qs.sel === null ? " disabled" : "") + ">Responder</button>") +
      "</div><span class=\"note\">Código " + esc(q.id) + " · questão inédita no estilo VUNESP</span></article>";
    app.innerHTML = html;
    bindFiltros();
    app.querySelectorAll("[data-alt]").forEach(function (b) {
      b.onclick = function () { var k = +b.dataset.alt; qs.sel = k; delete qs.cortes[k]; viewQuestoes(); };
    });
    app.querySelectorAll("[data-cut]").forEach(function (b) {
      b.onclick = function () { var k = +b.dataset.cut; qs.cortes[k] = !qs.cortes[k]; if (qs.cortes[k] && qs.sel === k) qs.sel = null; viewQuestoes(); };
    });
    var bA = document.getElementById("bAnswer");
    if (bA) bA.onclick = function () { registrar(q, qs.sel); qs.respondida = true; viewQuestoes(); };
    var bN = document.getElementById("bNext");
    if (bN) bN.onclick = function () { qs.i++; resetQ(); viewQuestoes(); window.scrollTo(0, 0); };
    document.getElementById("bPrev").onclick = function () { qs.i--; resetQ(); viewQuestoes(); window.scrollTo(0, 0); };
  }
  function bindFiltros() {
    document.getElementById("filtros").ontoggle = function (e) { filtrosAbertos = e.target.open; };
    document.getElementById("fDisc").onchange = function (e) { qs.disc = e.target.value; qs.ass = ""; novaLista(false); viewQuestoes(); };
    document.getElementById("fAss").onchange = function (e) { qs.ass = e.target.value; novaLista(false); viewQuestoes(); };
    document.getElementById("fStatus").onchange = function (e) { qs.status = e.target.value; novaLista(false); viewQuestoes(); };
    document.getElementById("bShuffle").onclick = function () { novaLista(true); viewQuestoes(); toast("Ordem embaralhada"); };
  }

  // ---------- ABA SIMULADO ----------
  var sim = null; // { ids, resp, i, inicio, limite, fim, confirmar }
  var simCfg = { qtd: 20, discs: null, tempo: true, modo: "prova" };
  var tick;

  function viewSimulado() {
    clearInterval(tick);
    if (sim && !sim.fim) return simRodando();
    if (sim && sim.fim) return simResultado();
    var discs = ordenar(uniq(todas().map(function (q) { return q.disciplina; })));
    if (!simCfg.discs) simCfg.discs = discs.slice();
    var disponiveis = todas().filter(function (q) { return simCfg.discs.indexOf(q.disciplina) >= 0; }).length;
    app.innerHTML = '<section class="panel"><h2>Montar simulado</h2>' +
      '<p class="hint">Responda sem ver o gabarito. A correção sai no fim, como na prova.</p>' +
      '<label class="f">Formato<select id="sModo">' +
      '<option value="prova"' + (simCfg.modo === "prova" ? " selected" : "") + '>Modelo da prova AJAJ (40% gerais, 60% específicas)</option>' +
      '<option value="igual"' + (simCfg.modo === "igual" ? " selected" : "") + '>Mesmo número por disciplina</option></select></label>' +
      '<p class="note">Prova real: 24 questões de Conhecimentos Gerais (peso 1) e 36 de Específicos (peso 2). Você vê a nota ponderada no resultado.</p>' +
      '<label class="f">Número de questões<select id="sQtd">' +
      [5, 10, 20, 30, 40, 60].map(function (n) { return "<option" + (n === simCfg.qtd ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      "</select></label>" +
      '<div><span class="f" style="display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Disciplinas</span><div class="checks">' +
      discs.map(function (d, k) {
        return '<label><input type="checkbox" id="sd' + k + '" value="' + esc(d) + '"' + (simCfg.discs.indexOf(d) >= 0 ? " checked" : "") + ">" + esc(d) + "</label>";
      }).join("") + "</div></div>" +
      '<div class="checks"><label><input type="checkbox" id="sTempo"' + (simCfg.tempo ? " checked" : "") + "> Cronometrar (3 min por questão)</label></div>" +
      '<div class="row"><button id="sGo" class="primary"' + (disponiveis ? "" : " disabled") + ">Começar simulado</button>" +
      '<span class="note">' + disponiveis + " questões disponíveis</span></div></section>" +
      historicoSims();
    document.getElementById("sQtd").onchange = function (e) { simCfg.qtd = +e.target.value; };
    document.getElementById("sModo").onchange = function (e) { simCfg.modo = e.target.value; };
    document.getElementById("sTempo").onchange = function (e) { simCfg.tempo = e.target.checked; };
    app.querySelectorAll('.checks input[id^="sd"]').forEach(function (c) {
      c.onchange = function () {
        simCfg.discs = Array.prototype.map.call(app.querySelectorAll('.checks input[id^="sd"]:checked'), function (x) { return x.value; });
        viewSimulado();
      };
    });
    document.getElementById("sGo").onclick = function () {
      // sorteia em rodízio entre as disciplinas para não concentrar numa só
      function sortear(discs, n, ja) {
        var grupos = discs.map(function (d) { return shuffle(todas().filter(function (q) { return q.disciplina === d && ja.indexOf(q.id) < 0; })); });
        var out = [];
        while (out.length < n && grupos.some(function (g) { return g.length; })) {
          grupos.forEach(function (g) { if (g.length && out.length < n) out.push(g.shift().id); });
        }
        return out;
      }
      var ids = [];
      if (simCfg.modo === "prova") {
        var gerais = simCfg.discs.filter(function (d) { var b = blocoDe(d); return !b || b.peso === 1; });
        var espec = simCfg.discs.filter(function (d) { var b = blocoDe(d); return b && b.peso !== 1; });
        var nG = Math.round(simCfg.qtd * 24 / 60);
        ids = sortear(gerais, nG, []);
        ids = ids.concat(sortear(espec, simCfg.qtd - ids.length, ids));
        if (ids.length < simCfg.qtd) ids = ids.concat(sortear(simCfg.discs, simCfg.qtd - ids.length, ids));
      } else {
        ids = sortear(simCfg.discs, simCfg.qtd, []);
      }
      ids = ids.sort(function (a, b) { return ORDEM.indexOf(porId(a).disciplina) - ORDEM.indexOf(porId(b).disciplina); });
      sim = { ids: ids, resp: {}, i: 0, inicio: Date.now(), limite: simCfg.tempo ? ids.length * 180 : 0, fim: 0, confirmar: false };
      viewSimulado();
    };
  }

  function historicoSims() {
    if (!store.sims.length) return "";
    return '<section class="panel"><h2>Simulados anteriores</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Acertos</th><th>%</th><th>Nota</th><th>Tempo</th></tr></thead><tbody>' +
      store.sims.slice(-10).reverse().map(function (s) {
        return "<tr><td>" + new Date(s.t).toLocaleDateString("pt-BR") + '</td><td class="n">' + s.ac + "/" + s.n + '</td><td class="n">' + pct(s.ac, s.n) + '%</td><td class="n">' + (s.max ? s.pts + "/" + s.max : "-") + '</td><td class="n">' + mmss(s.seg) + "</td></tr>";
      }).join("") + "</tbody></table></div></section>";
  }

  function restante() { return sim.limite ? sim.limite - (Date.now() - sim.inicio) / 1000 : null; }

  function simRodando() {
    var q = porId(sim.ids[sim.i]);
    var feitas = Object.keys(sim.resp).length;
    var r = restante();
    app.innerHTML = '<section class="panel"><div class="row" style="justify-content:space-between">' +
      '<span class="num" style="font:600 14px var(--f-num)">Questão ' + (sim.i + 1) + " de " + sim.ids.length + "</span>" +
      '<span class="timer' + (r !== null && r < 300 ? " low" : "") + '" id="tm">' + (r === null ? mmss((Date.now() - sim.inicio) / 1000) : mmss(r)) + "</span></div>" +
      '<div class="qmeta"><span class="chip">' + esc(q.disciplina) + "</span><span>" + esc(q.assunto) + "</span></div>" +
      '<p class="enun">' + esc(q.enunciado) + "</p>" +
      altsHTML(q, sim.resp[q.id] === undefined ? null : sim.resp[q.id], sim.cortes && sim.cortes[q.id] || {}, false, true) +
      '<div class="navq"><button id="pPrev" class="ghost"' + (sim.i === 0 ? " disabled" : "") + ">Anterior</button>" +
      '<button id="pNext" class="primary grow"' + (sim.i >= sim.ids.length - 1 ? " disabled" : "") + ">Próxima</button></div></section>" +
      '<section class="panel"><h2>Cartão-resposta</h2><div class="sheetgrid">' +
      sim.ids.map(function (id, k) {
        var a = sim.resp[id];
        return '<button data-go="' + k + '" class="' + (a !== undefined ? "done" : "") + (k === sim.i ? " here" : "") + '">' + (k + 1) + "<span>" + (a !== undefined ? LETRAS[a] : "·") + "</span></button>";
      }).join("") + "</div>" +
      (sim.confirmar
        ? '<div class="result err"><strong>Entregar com ' + (sim.ids.length - feitas) + ' em branco?</strong><div class="row"><button id="eSim" class="primary">Sim, entregar</button><button id="eNao" class="ghost">Voltar</button></div></div>'
        : '<div class="row"><button id="eGo" class="primary">Entregar simulado</button><span class="note">' + feitas + " de " + sim.ids.length + ' respondidas</span><button id="eCancel" class="ghost">Desistir</button></div>') +
      "</section>";
    app.querySelectorAll("[data-alt]").forEach(function (b) {
      b.onclick = function () { sim.resp[q.id] = +b.dataset.alt; if (sim.cortes && sim.cortes[q.id]) delete sim.cortes[q.id][+b.dataset.alt]; simRodando(); };
    });
    app.querySelectorAll("[data-cut]").forEach(function (b) {
      b.onclick = function () {
        sim.cortes = sim.cortes || {}; var c = sim.cortes[q.id] = sim.cortes[q.id] || {};
        var k = +b.dataset.cut; c[k] = !c[k]; if (c[k] && sim.resp[q.id] === k) delete sim.resp[q.id]; simRodando();
      };
    });
    app.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { sim.i = +b.dataset.go; simRodando(); window.scrollTo(0, 0); }; });
    document.getElementById("pPrev").onclick = function () { sim.i--; simRodando(); window.scrollTo(0, 0); };
    document.getElementById("pNext").onclick = function () { sim.i++; simRodando(); window.scrollTo(0, 0); };
    var eGo = document.getElementById("eGo");
    if (eGo) eGo.onclick = function () { if (feitas < sim.ids.length) { sim.confirmar = true; simRodando(); } else entregar(); };
    var eSim = document.getElementById("eSim"); if (eSim) eSim.onclick = entregar;
    var eNao = document.getElementById("eNao"); if (eNao) eNao.onclick = function () { sim.confirmar = false; simRodando(); };
    var eC = document.getElementById("eCancel"); if (eC) eC.onclick = function () { sim = null; viewSimulado(); };
    clearInterval(tick);
    tick = setInterval(function () {
      var el = document.getElementById("tm"); if (!el || !sim || sim.fim) return clearInterval(tick);
      var rr = restante();
      if (rr !== null && rr <= 0) { toast("Tempo esgotado"); return entregar(); }
      el.textContent = rr === null ? mmss((Date.now() - sim.inicio) / 1000) : mmss(rr);
      el.classList.toggle("low", rr !== null && rr < 300);
    }, 1000);
  }

  function entregar() {
    clearInterval(tick);
    sim.fim = Date.now();
    var ac = 0;
    sim.ids.forEach(function (id) {
      var a = sim.resp[id]; if (a === undefined) return;
      if (registrar(porId(id), a)) ac++;
    });
    var np = notaPonderada(sim.ids, sim.resp);
    store.sims.push({ t: sim.fim, n: sim.ids.length, ac: ac, pts: np.pts, max: np.max, seg: Math.round((sim.fim - sim.inicio) / 1000) });
    save();
    sim.confirmar = false;
    viewSimulado(); window.scrollTo(0, 0);
  }

  function notaPonderada(ids, resp) {
    var pts = 0, max = 0;
    ids.forEach(function (id) { var q = porId(id); if (!q) return; var w = pesoDe(q.disciplina); max += w; if (resp[id] === q.correta) pts += w; });
    return { pts: pts, max: max };
  }
  function simResultado() {
    var porDisc = {}; var ac = 0;
    sim.ids.forEach(function (id) {
      var q = porId(id); var d = porDisc[q.disciplina] = porDisc[q.disciplina] || { n: 0, ac: 0 };
      d.n++; if (sim.resp[id] === q.correta) { d.ac++; ac++; }
    });
    var n = sim.ids.length;
    var np = notaPonderada(sim.ids, sim.resp);
    app.innerHTML = '<section class="panel"><h2>Resultado do simulado</h2><div class="kpis">' +
      '<div class="kpi"><b>' + ac + "/" + n + "</b><span>acertos</span></div>" +
      '<div class="kpi"><b>' + pct(ac, n) + "%</b><span>aproveitamento</span></div>" +
      '<div class="kpi"><b>' + np.pts + "/" + np.max + "</b><span>nota ponderada (gerais ×1, específicas ×2)</span></div>" +
      '<div class="kpi"><b>' + mmss((sim.fim - sim.inicio) / 1000) + "</b><span>tempo usado</span></div></div>" +
      '<div class="scroll"><table><thead><tr><th>Disciplina</th><th>Acertos</th><th>%</th></tr></thead><tbody>' +
      ordenar(Object.keys(porDisc)).map(function (d) {
        return "<tr><td>" + esc(d) + '</td><td class="n">' + porDisc[d].ac + "/" + porDisc[d].n + '</td><td class="n">' + pct(porDisc[d].ac, porDisc[d].n) + "%</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<div class="row"><button id="rNovo" class="primary">Novo simulado</button></div></section>' +
      '<section class="panel"><h2>Correção</h2>' +
      sim.ids.map(function (id, k) {
        var q = porId(id); var a = sim.resp[id]; var ok = a === q.correta;
        return '<details><summary><span class="chip ' + (ok ? "ok" : "err") + '">' + (k + 1) + " · " + (a === undefined ? "em branco" : "marcou " + LETRAS[a]) + " · gabarito " + LETRAS[q.correta] + "</span> " + esc(q.assunto) + "</summary>" +
          '<div style="display:grid;gap:10px;padding-top:10px"><p class="enun">' + esc(q.enunciado) + "</p>" +
          altsHTML(q, a === undefined ? null : a, {}, true, false) +
          '<p class="coment">' + esc(q.comentario || "") + "</p></div></details>";
      }).join("") + "</section>";
    document.getElementById("rNovo").onclick = function () { sim = null; viewSimulado(); };
  }

  // ---------- ABA PÓS-AULA ----------
  // Revisão logo depois da aula + revisões espaçadas em 1, 7 e 30 dias.
  var DIA = 86400000;
  var ETAPAS = [1, 7, 30];
  var ETAPA_NOME = ["revisão de 24h", "revisão de 7 dias", "revisão de 30 dias"];
  var rv = { disc: "", asss: [], qtd: 10, sessao: null };
  function hoje0() { var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function dataBR(t) { return new Date(t).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }); }
  function proxData(r) { return r.feitas.length < ETAPAS.length ? r.base + ETAPAS[r.feitas.length] * DIA : null; }
  function revsHoje() { var h = hoje0(); return store.revs.filter(function (r) { var p = proxData(r); return p !== null && p <= h; }); }
  function revTitulo(r) { return esc(r.disc) + " · " + esc(r.asss.join(", ")); }

  function iniciarRevisao(disc, asss, qtd, revId) {
    var pool = todas().filter(function (q) { return q.disciplina === disc && asss.indexOf(q.assunto) >= 0; });
    // erradas e não vistas primeiro
    pool = shuffle(pool).sort(function (a, b) {
      function peso(q) { var u = ultima(q.id); return !u ? 1 : u.c ? 2 : 0; }
      return peso(a) - peso(b);
    });
    if (!pool.length) return toast("Não há questões desses assuntos");
    rv.sessao = { ids: pool.slice(0, qtd).map(function (q) { return q.id; }), i: 0, sel: null, respondida: false, cortes: {},
      ac: 0, marcadas: {}, disc: disc, asss: asss, revId: revId || null, fim: false };
    viewPosAula(); window.scrollTo(0, 0);
  }

  function viewPosAula() {
    var s = rv.sessao;
    if (s && !s.fim) return rvRodando();
    if (s && s.fim) return rvResumo();
    var all = todas();
    var discs = ordenar(uniq(all.map(function (q) { return q.disciplina; })));
    if (!rv.disc) rv.disc = discs[0] || "";
    var asssDisc = uniq(all.filter(function (q) { return q.disciplina === rv.disc; }).map(function (q) { return q.assunto; })).sort();
    rv.asss = rv.asss.filter(function (a) { return asssDisc.indexOf(a) >= 0; });
    var nQ = all.filter(function (q) { return q.disciplina === rv.disc && rv.asss.indexOf(q.assunto) >= 0; }).length;
    var hoje = revsHoje();
    var futuras = store.revs.filter(function (r) { var p = proxData(r); return p !== null && p > hoje0(); })
      .sort(function (a, b) { return proxData(a) - proxData(b); });

    var html = '<section class="panel"><h2>Revisões de hoje</h2>' +
      (hoje.length
        ? '<div class="bars">' + hoje.map(function (r) {
            var atraso = proxData(r) < hoje0();
            return '<div class="revitem"><div><b>' + revTitulo(r) + '</b><br><span class="note">' + ETAPA_NOME[r.feitas.length] +
              (atraso ? ' · <span class="chip err">atrasada desde ' + dataBR(proxData(r)) + "</span>" : "") + "</span></div>" +
              '<button class="primary" data-rev="' + r.id + '">Fazer</button></div>';
          }).join("") + "</div>"
        : '<p class="hint">Nada para revisar hoje. Depois de cada aula, registre abaixo e o app agenda as revisões.</p>') +
      "</section>" +
      '<section class="panel"><h2>Acabei de assistir uma aula</h2>' +
      '<p class="hint">Marque o que foi visto na aula. Você resolve as questões agora, com gabarito na hora, e o app agenda revisões para daqui a 1, 7 e 30 dias.</p>' +
      '<label class="f">Disciplina<select id="rDisc">' +
      discs.map(function (d) { return "<option" + (d === rv.disc ? " selected" : "") + ">" + esc(d) + "</option>"; }).join("") + "</select></label>" +
      '<div><span class="f">Assuntos da aula</span><div class="checks">' +
      asssDisc.map(function (a, k) {
        var n = all.filter(function (q) { return q.disciplina === rv.disc && q.assunto === a; }).length;
        return '<label><input type="checkbox" id="ra' + k + '" value="' + esc(a) + '"' + (rv.asss.indexOf(a) >= 0 ? " checked" : "") + ">" + esc(a) + ' <span class="note">(' + n + ")</span></label>";
      }).join("") + "</div></div>" +
      '<label class="f">Máximo de questões<select id="rQtd">' +
      [5, 10, 20].map(function (n) { return "<option" + (n === rv.qtd ? " selected" : "") + ">" + n + "</option>"; }).join("") + "</select></label>" +
      '<div class="row"><button id="rGo" class="primary"' + (nQ ? "" : " disabled") + ">Começar revisão pós-aula</button>" +
      '<span class="note">' + (nQ ? Math.min(nQ, rv.qtd) + " questões" : "Marque ao menos um assunto") + "</span></div></section>";

    if (futuras.length) {
      html += '<section class="panel"><h2>Próximas revisões</h2><div class="scroll"><table><thead><tr><th>Data</th><th>Aula</th><th>Etapa</th><th></th></tr></thead><tbody>' +
        futuras.slice(0, 15).map(function (r) {
          return '<tr><td class="n">' + dataBR(proxData(r)) + "</td><td>" + revTitulo(r) + "</td><td>" + (r.feitas.length + 1) + '/3</td><td><button class="cutbtn" data-del="' + r.id + '">remover</button></td></tr>';
        }).join("") + "</tbody></table></div></section>";
    }
    app.innerHTML = html;
    document.getElementById("rDisc").onchange = function (e) { rv.disc = e.target.value; rv.asss = []; viewPosAula(); };
    app.querySelectorAll('input[id^="ra"]').forEach(function (c) {
      c.onchange = function () {
        rv.asss = Array.prototype.map.call(app.querySelectorAll('input[id^="ra"]:checked'), function (x) { return x.value; });
        viewPosAula();
      };
    });
    document.getElementById("rQtd").onchange = function (e) { rv.qtd = +e.target.value; viewPosAula(); };
    document.getElementById("rGo").onclick = function () { iniciarRevisao(rv.disc, rv.asss.slice(), rv.qtd, null); };
    app.querySelectorAll("[data-rev]").forEach(function (b) {
      b.onclick = function () {
        var r = store.revs.find(function (x) { return String(x.id) === b.dataset.rev; });
        if (r) iniciarRevisao(r.disc, r.asss, 10, r.id);
      };
    });
    app.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        store.revs = store.revs.filter(function (x) { return String(x.id) !== b.dataset.del; }); save(); toast("Revisão removida"); viewPosAula(); marcarAbas();
      };
    });
  }

  function rvRodando() {
    var s = rv.sessao; var q = porId(s.ids[s.i]); var ultimaQ = s.i >= s.ids.length - 1;
    var html = '<article class="panel" aria-live="polite">' +
      '<div class="qmeta"><span class="num">' + (s.i + 1) + "/" + s.ids.length + '</span><span class="chip">' +
      (s.revId ? "Revisão agendada" : "Pós-aula") + "</span><span>" + esc(q.assunto) + "</span>" +
      '<span class="note">' + s.ac + " acertos até agora</span></div>" +
      '<div class="track"><div class="fill" style="width:' + pct(s.i + (s.respondida ? 1 : 0), s.ids.length) + '%"></div></div>' +
      '<p class="enun">' + esc(q.enunciado) + "</p>" + altsHTML(q, s.sel, s.cortes, s.respondida, true);
    if (s.respondida) {
      var ok = s.sel === q.correta;
      html += '<div class="result ' + (ok ? "ok" : "err") + '"><strong>' + (ok ? "Você acertou." : "Você errou. Gabarito: " + LETRAS[q.correta] + ".") + "</strong>" +
        '<p class="coment">' + esc(q.comentario || "Sem comentário.") + "</p></div>";
    }
    html += '<div class="navq"><button id="vSair" class="ghost">Sair</button>' +
      (s.respondida
        ? '<button id="vNext" class="primary grow">' + (ultimaQ ? "Ver resumo" : "Próxima questão") + "</button>"
        : '<button id="vAns" class="primary grow"' + (s.sel === null ? " disabled" : "") + ">Responder</button>") + "</div></article>";
    app.innerHTML = html;
    app.querySelectorAll("[data-alt]").forEach(function (b) { b.onclick = function () { var k = +b.dataset.alt; s.sel = k; delete s.cortes[k]; rvRodando(); }; });
    app.querySelectorAll("[data-cut]").forEach(function (b) { b.onclick = function () { var k = +b.dataset.cut; s.cortes[k] = !s.cortes[k]; if (s.cortes[k] && s.sel === k) s.sel = null; rvRodando(); }; });
    var a = document.getElementById("vAns");
    if (a) a.onclick = function () { s.marcadas[q.id] = s.sel; if (registrar(q, s.sel)) s.ac++; s.respondida = true; rvRodando(); };
    var n = document.getElementById("vNext");
    if (n) n.onclick = function () {
      if (ultimaQ) return concluirRevisao();
      s.i++; s.sel = null; s.respondida = false; s.cortes = {}; rvRodando(); window.scrollTo(0, 0);
    };
    document.getElementById("vSair").onclick = function () { rv.sessao = null; viewPosAula(); };
  }

  function concluirRevisao() {
    var s = rv.sessao; s.fim = true;
    var r;
    if (s.revId) {
      r = store.revs.find(function (x) { return x.id === s.revId; });
      if (r) r.feitas.push(Date.now());
    } else {
      r = { id: Date.now(), disc: s.disc, asss: s.asss, base: hoje0(), feitas: [] };
      store.revs.push(r);
    }
    s.rev = r; save(); marcarAbas(); viewPosAula(); window.scrollTo(0, 0);
  }

  function rvResumo() {
    var s = rv.sessao; var n = s.ids.length; var r = s.rev;
    var erradas = s.ids.filter(function (id) { return s.marcadas[id] !== porId(id).correta; });
    var agenda = r ? ETAPAS.map(function (d, k) {
      return k < r.feitas.length ? "" : "<li>" + dataBR(r.base + d * DIA) + " · " + ETAPA_NOME[k] + "</li>";
    }).join("") : "";
    app.innerHTML = '<section class="panel"><h2>' + (s.revId ? "Revisão concluída" : "Revisão pós-aula concluída") + '</h2><div class="kpis">' +
      '<div class="kpi"><b>' + s.ac + "/" + n + "</b><span>acertos</span></div>" +
      '<div class="kpi"><b>' + pct(s.ac, n) + "%</b><span>aproveitamento</span></div></div>" +
      (agenda ? '<div><b>Próximas revisões agendadas</b><ul class="agenda">' + agenda + "</ul></div>" : '<p class="hint">Ciclo de revisões deste assunto completo.</p>') +
      '<div class="row"><button id="vVolta" class="primary">Voltar</button></div></section>' +
      (erradas.length ? '<section class="panel"><h2>Revise o que errou</h2>' + erradas.map(function (id) {
        var q = porId(id); var a = s.marcadas[id];
        return '<details><summary><span class="chip err">marcou ' + LETRAS[a] + " · gabarito " + LETRAS[q.correta] + "</span> " + esc(q.assunto) + "</summary>" +
          '<div style="display:grid;gap:10px;padding-top:10px"><p class="enun">' + esc(q.enunciado) + "</p>" +
          altsHTML(q, a, {}, true, false) + '<p class="coment">' + esc(q.comentario || "") + "</p></div></details>";
      }).join("") + "</section>" : "");
    document.getElementById("vVolta").onclick = function () { rv.sessao = null; viewPosAula(); };
  }

  function marcarAbas() {
    var n = revsHoje().length;
    var a = document.querySelector('[data-tab="posaula"]');
    if (a) a.innerHTML = "Pós-aula" + (n ? ' <span class="badge">' + n + "</span>" : "");
  }

  // ---------- ABA DESEMPENHO ----------
  function viewDesempenho() {
    var all = todas();
    var tent = 0, acTot = 0, resolvidas = 0, pend = 0, disc = {};
    all.forEach(function (q) {
      var r = store.resp[q.id] || [];
      var d = disc[q.disciplina] = disc[q.disciplina] || { n: 0, ac: 0, total: 0, feitas: 0 };
      d.total++;
      if (r.length) { resolvidas++; d.feitas++; if (!r[r.length - 1].c) pend++; }
      r.forEach(function (x) { tent++; d.n++; if (x.c) { acTot++; d.ac++; } });
    });
    function barras(nomes) {
      nomes = nomes.filter(function (n) { return disc[n]; }).sort(function (a, b) {
        var da = disc[a], db = disc[b];
        return (da.n ? pct(da.ac, da.n) : 101) - (db.n ? pct(db.ac, db.n) : 101);
      });
      return '<div class="bars">' + nomes.map(function (n) {
        var d = disc[n]; var p = pct(d.ac, d.n);
        return '<div class="bar"><div class="lbl"><span>' + esc(n) + "</span><span>" + (d.n ? p + "% · " + d.ac + "/" + d.n : "sem respostas") + " · vistas " + d.feitas + "/" + d.total + "</span></div>" +
          '<div class="track"><div class="fill ' + (d.n ? (p >= 70 ? "good" : p < 50 ? "bad" : "") : "") + '" style="width:' + (d.n ? p : 0) + '%"></div></div></div>';
      }).join("") + "</div>";
    }
    var fora = Object.keys(disc).filter(function (n) { return ORDEM.indexOf(n) < 0; });
    app.innerHTML = '<section class="panel"><h2>Desempenho de ' + esc(perfil) + '</h2><div class="kpis">' +
      '<div class="kpi"><b>' + resolvidas + "/" + all.length + "</b><span>questões já vistas</span></div>" +
      '<div class="kpi"><b>' + pct(acTot, tent) + "%</b><span>acerto em " + tent + " respostas</span></div>" +
      '<div class="kpi"><b>' + pend + "</b><span>para revisar (errou da última vez)</span></div>" +
      '<div class="kpi"><b>' + store.sims.length + "</b><span>simulados feitos</span></div></div>" +
      (pend ? '<div class="row"><button id="dRev" class="primary">Revisar ' + pend + " erros</button></div>" : "") +
      "</section>" +
      EDITAL.blocos.map(function (b) {
        return '<section class="panel"><h2>' + esc(b.nome) + '</h2><p class="hint">' + b.questoes + " questões na prova, peso " + b.peso + ". Da pior para a melhor matéria: comece pelo topo.</p>" + barras(b.disciplinas) + "</section>";
      }).join("") +
      (fora.length ? '<section class="panel"><h2>Outras</h2>' + barras(fora) + "</section>" : "") +
      historicoSims();
    var b = document.getElementById("dRev");
    if (b) b.onclick = function () { qs.disc = ""; qs.ass = ""; qs.status = "erradas"; novaLista(false); location.hash = "#questoes"; };
  }

  // ---------- ABA AJUSTES ----------
  var resetPend = false;
  function viewAjustes() {
    app.innerHTML =
      '<section class="panel"><h2>Backup do progresso de ' + esc(perfil) + '</h2><p class="hint">O progresso fica salvo só neste navegador. Copie o backup para guardar ou levar para outro aparelho.</p>' +
      '<div class="row"><button id="aCopy" class="primary">Copiar backup</button></div>' +
      '<label class="f">Colar backup para restaurar<textarea id="aBackup" placeholder="Cole aqui o texto do backup"></textarea></label>' +
      '<div class="row"><button id="aRestore">Restaurar backup</button></div></section>' +
      '<section class="panel"><h2>Adicionar questões</h2><p class="hint">Cole uma lista em JSON no mesmo formato do arquivo questoes.js. Questões com código repetido são ignoradas.</p>' +
      '<label class="f">Questões em JSON<textarea id="aImport" placeholder=\'[{"id":"meu-001","disciplina":"Direito Penal","assunto":"Peculato","enunciado":"…","alternativas":["…","…","…","…","…"],"correta":0,"comentario":"…"}]\'></textarea></label>' +
      '<div class="row"><button id="aImp">Adicionar questões</button><span class="note">' + extras.length + " questões adicionadas (valem para as duas pessoas)</span></div></section>" +
      '<section class="panel"><h2>Zerar progresso de ' + esc(perfil) + '</h2><p class="hint">Apaga respostas, simulados e revisões agendadas só desta pessoa. As questões adicionadas por você continuam.</p>' +
      (resetPend
        ? '<div class="row"><button id="aResetSim" class="danger">Sim, apagar tudo</button><button id="aResetNao" class="ghost">Cancelar</button></div>'
        : '<div class="row"><button id="aReset" class="danger">Zerar progresso</button></div>') +
      "</section>";
    document.getElementById("aCopy").onclick = function () {
      var txt = JSON.stringify({ perfil: perfil, resp: store.resp, sims: store.sims, revs: store.revs, extra: extras });
      var ta = document.getElementById("aBackup");
      function fallback() { ta.value = txt; ta.focus(); ta.select(); toast("Selecionei o backup. Copie com o menu do teclado."); }
      try { navigator.clipboard.writeText(txt).then(function () { toast("Backup copiado"); }, fallback); } catch (e) { fallback(); }
    };
    document.getElementById("aRestore").onclick = function () {
      try {
        var s = JSON.parse(document.getElementById("aBackup").value);
        if (!s || typeof s.resp !== "object") throw new Error();
        store = { resp: s.resp || {}, sims: s.sims || [], revs: s.revs || [] }; save();
        var ids = todas().map(function (q) { return q.id; });
        (s.extra || []).forEach(function (q) { if (q && q.id && ids.indexOf(q.id) < 0) extras.push(q); });
        saveExtras(); toast("Backup restaurado em " + perfil); contar(); render();
      } catch (e) { toast("Texto inválido. Cole o backup completo, começando com {"); }
    };
    document.getElementById("aImp").onclick = function () {
      var lista;
      try { lista = JSON.parse(document.getElementById("aImport").value); } catch (e) { return toast("JSON inválido. Confira aspas e vírgulas."); }
      if (!Array.isArray(lista)) lista = [lista];
      var ids = todas().map(function (q) { return q.id; }); var add = 0;
      lista.forEach(function (q) {
        var valida = q && q.id && q.enunciado && Array.isArray(q.alternativas) && q.alternativas.length >= 2 &&
          typeof q.correta === "number" && q.correta >= 0 && q.correta < q.alternativas.length;
        if (valida && ids.indexOf(q.id) < 0) {
          extras.push({ id: String(q.id), disciplina: q.disciplina || "Outras", assunto: q.assunto || "Geral", enunciado: q.enunciado, alternativas: q.alternativas.slice(0, 5), correta: q.correta, comentario: q.comentario || "" });
          ids.push(q.id); add++;
        }
      });
      saveExtras(); toast(add + " questões adicionadas"); novaLista(false); viewAjustes(); contar();
    };
    var r = document.getElementById("aReset"); if (r) r.onclick = function () { resetPend = true; viewAjustes(); };
    var rs = document.getElementById("aResetSim"); if (rs) rs.onclick = function () { store.resp = {}; store.sims = []; store.revs = []; save(); resetPend = false; toast("Progresso zerado"); viewAjustes(); };
    var rn = document.getElementById("aResetNao"); if (rn) rn.onclick = function () { resetPend = false; viewAjustes(); };
  }

  // ---------- roteamento ----------
  function contar() {
    document.getElementById("brandCount").textContent = perfil ? perfil + " · " + todas().length + " questões" : "";
    document.getElementById("bTrocar").hidden = !perfil;
  }

  function telaPerfil() {
    document.body.classList.add("sem-perfil");
    contar();
    app.innerHTML = '<section class="panel"><h2>Quem vai estudar agora?</h2>' +
      '<p class="hint">Cada pessoa tem suas próprias respostas, revisões e simulados.</p><div class="perfis">' +
      PERFIS.map(function (n) {
        var s = load(n);
        var vistas = Object.keys(s.resp).length;
        var h = hoje0();
        var hoje = s.revs.filter(function (r) { var p = proxData(r); return p !== null && p <= h; }).length;
        return '<button class="perfil" data-perfil="' + esc(n) + '"><span class="ini">' + esc(n.charAt(0)) + "</span><span><b>" + esc(n) + '</b><span class="note">' +
          vistas + (vistas === 1 ? " questão vista" : " questões vistas") + (hoje ? " · " + hoje + (hoje === 1 ? " revisão" : " revisões") + " para hoje" : "") + "</span></span></button>";
      }).join("") + "</div>" +
      '<p class="note">' + esc(EDITAL.cargo) + " · TRF3 · VUNESP</p></section>";
    app.querySelectorAll("[data-perfil]").forEach(function (b) {
      b.onclick = function () { entrar(b.dataset.perfil); };
    });
  }

  function entrar(nome) {
    perfil = nome; store = load(nome);
    clearInterval(tick); sim = null; rv.sessao = null; rv.disc = ""; rv.asss = []; simCfg.discs = null;
    qs.disc = ""; qs.ass = ""; qs.status = "todas";
    document.body.classList.remove("sem-perfil");
    contar(); novaLista(false);
    if (location.hash !== "#questoes" && location.hash !== "") location.hash = "#questoes"; else render();
    window.scrollTo(0, 0);
  }
  var views = { questoes: viewQuestoes, posaula: viewPosAula, simulado: viewSimulado, desempenho: viewDesempenho, ajustes: viewAjustes };
  function render() {
    if (!perfil) return telaPerfil();
    var tab = (location.hash || "").slice(1);
    if (!views[tab]) tab = "questoes";
    document.querySelectorAll("[data-tab]").forEach(function (a) {
      if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (tab !== "simulado") clearInterval(tick);
    marcarAbas();
    views[tab]();
  }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });
  document.getElementById("bTrocar").onclick = function () { clearInterval(tick); perfil = null; sim = null; rv.sessao = null; render(); window.scrollTo(0, 0); };
  render();
})();
</script>
</body>
</html>
